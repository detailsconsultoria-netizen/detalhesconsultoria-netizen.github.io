<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explora as Estampas — Details Consultoria</title>
<style>
  :root {
    --ink: #F2ECE1;
    --bg: #0A0A0A;
    --gold: #B69655;
    --muted: rgba(242,236,225,0.65);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 8vh 6vw;
  }
  .wrap { max-width: 480px; text-align: center; }
  .mark { width: 34px; height: 34px; margin: 0 auto 28px; opacity: 0.9; }
  .eyebrow {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic; font-weight: 400;
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.2; margin: 0 0 18px; color: var(--ink);
  }
  p.desc { font-size: 14.5px; line-height: 1.7; color: var(--muted); margin: 0 0 36px; }
  a.btn {
    display: inline-block;
    padding: 15px 38px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--ink);
    text-decoration: none;
    font-size: 12.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: background 0.25s ease, color 0.25s ease;
  }
  a.btn:hover { background: var(--gold); color: var(--bg); }
  .foot {
    margin-top: 40px; font-size: 10.5px; letter-spacing: 1px;
    color: rgba(242,236,225,0.4); text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#F2ECE1" stroke-width="1">
      <polygon points="15,10 45,10 30,30"></polygon>
      <polygon points="15,50 45,50 30,30"></polygon>
    </svg>
    <div class="eyebrow">Details Consultoria</div>
    <h1>Explora as Estampas que já Tens no Roupeiro</h1>
    <p class="desc">Um exercício simples para começares a perceber que estampas combinam mais contigo e como podes usá-las melhor no teu dia a dia.</p>
    <a class="btn" href="Guia%20Pr%C3%A1tico%20de%20Estampas.pdf" download>Aceder ao Guia</a>
    <div class="foot">Isana Machado &middot; 2026</div>
  </div>
</body>
</html>
